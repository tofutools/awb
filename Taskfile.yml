version: "3"

vars:
  ADDR: '{{default "127.0.0.1:7777" .ADDR}}'
  OUTPUT_DIR: '{{default "." .OUTPUT_DIR}}'

tasks:
  default:
    desc: List available tasks
    silent: true
    cmds:
      - task --list

  check:
    desc: Build, test, and lint everything
    cmds:
      - task: fe:test
      - task: be:build
        vars:
          OUTPUT_DIR: "{{.OUTPUT_DIR}}"
      - task: be:test
      - task: lint

  build:
    desc: Build the frontend and the awb binary
    cmds:
      - task: fe:build
      - task: be:build
        vars:
          OUTPUT_DIR: "{{.OUTPUT_DIR}}"

  install:
    desc: Install awb to GOBIN or GOPATH/bin
    deps: [fe:build]
    cmds:
      - env CGO_ENABLED=0 go install -trimpath -buildvcs=true .

  init-db:
    desc: Initialize the awb database
    cmds:
      - go run . init {{.CLI_ARGS}}

  test:
    desc: Run all tests
    cmds:
      - task: fe:test
      - task: be:test

  lint:
    desc: Run the Go linter
    cmds:
      - golangci-lint run ./...

  run:
    desc: Build the frontend and run the development server
    cmds:
      - task: fe:build
      - task: be:run

  watch:
    desc: Restart the development server when source files change
    aliases: [dev]
    cmds:
      - watchexec --restart --exts go,ts,html,css,yaml,yml -- task run ADDR="{{.ADDR}}" -- {{.CLI_ARGS}}

  be:build:
    desc: Build the awb binary
    cmds:
      - env CGO_ENABLED=0 go build -trimpath -buildvcs=true -o "{{.OUTPUT_DIR}}/awb" .

  be:test:
    desc: Run the Go tests
    cmds:
      - go test ./...

  be:run:
    desc: Run the development server
    cmds:
      - go run . serve --addr "{{.ADDR}}" {{.CLI_ARGS}}

  fe:build:
    desc: Compile the TypeScript frontend
    cmds:
      - tsc --project web/ts/tsconfig.json

  fe:test:
    desc: Run the frontend tests
    deps: [fe:build]
    cmds:
      - node --test 'web/ts/tests/*.test.mjs'
