# Cross-compiles one awb binary for one target. This is the only place the
# cross build is defined: PR CI compiles every shipped target with it and the
# release workflow ships what it produces, so a target that gets released
# cannot be one that CI never compiled.
#
# It deliberately runs no tests and no lint. ./build.sh owns those and is the
# whole build, but it cannot cross-compile — its `go test` step would try to
# execute a foreign binary. The build line below therefore mirrors build.sh's
# binary step flag for flag and adds only the version stamp.
#
# Callers must check out the repo first; a local action cannot be resolved
# before that.
name: Build binary
description: Compile the frontend and cross-compile the awb binary for one GOOS/GOARCH.

inputs:
  goos:
    description: Target GOOS.
    required: true
  goarch:
    description: Target GOARCH.
    required: true
  version:
    description: >-
      Stamped into main.version, the first field `awb --version` prints; the
      commit after it comes from -buildvcs. Defaults to what an unstamped local
      build reports, so a compile-only check does not claim to be a release.
    default: dev
  output-dir:
    description: Directory to write the binary into. Created if absent.
    default: dist

runs:
  using: composite
  steps:
    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version-file: go.mod

    # The frontend is not a committed artifact: web/static/*.js is build output
    # and only the pre-built vendor bundles are committed. web/embed.go embeds
    # the directory as it finds it, so skipping tsc would yield a binary that
    # compiles and starts but serves a UI with no code. The build step below
    # must never run without this one.
    - name: Set up Node.js
      uses: actions/setup-node@v7
      with:
        node-version: 24

    - name: Install TypeScript
      shell: bash
      run: npm install -g typescript@7.0.2

    # Both generators are prerequisites of build.sh, which runs them itself.
    # Installing them here is provisioning a prerequisite, exactly as setup-go
    # provisions the Go toolchain, and does not contradict "no package manager
    # is ever invoked" — that rule is about build.sh, which still invokes none.
    #
    # Pinned for the same reason as the compiler and the linter: what they
    # generate is part of the build, so changing either should be a reviewed
    # commit rather than a silent change in what CI produces.
    - name: Install openapi-typescript
      shell: bash
      run: npm install -g openapi-typescript@7.13.0

    - name: Install ogen
      shell: bash
      run: go install github.com/ogen-go/ogen/cmd/ogen@v1.20.2

    # The generated code is not committed either: the Go server in internal/api
    # and the TypeScript types the frontend imports are both produced from
    # openapi.yaml, and nothing below compiles without them.
    - name: Generate from openapi.yaml
      shell: bash
      run: |
        set -euo pipefail
        go generate ./...
        openapi-typescript openapi.yaml -o web/ts/api-types.ts

    - name: Compile the frontend
      shell: bash
      run: tsc --project web/ts/tsconfig.json

    # The binary is always named `awb`, which is one of the two things to fix
    # if .github/targets.json ever grows a windows entry (the other, and the
    # reason it has not, is that no test suite runs there).
    - name: Build ${{ inputs.goos }}/${{ inputs.goarch }}
      shell: bash
      env:
        GOOS: ${{ inputs.goos }}
        GOARCH: ${{ inputs.goarch }}
        VERSION: ${{ inputs.version }}
        OUTPUT_DIR: ${{ inputs.output-dir }}
      run: |
        set -euo pipefail
        mkdir -p "$OUTPUT_DIR"
        env CGO_ENABLED=0 go build -trimpath -buildvcs=true \
          -ldflags "-X main.version=$VERSION" \
          -o "$OUTPUT_DIR/awb" .
